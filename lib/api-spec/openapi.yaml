openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bug Reproduction Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyses
    description: Bug report analysis pipeline operations
  - name: github
    description: GitHub issue ingestion
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      summary: List all bug analyses
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: inputType
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BugAnalysis"
    post:
      operationId: createAnalysis
      tags: [analyses]
      summary: Create a new bug analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisBody"
      responses:
        "201":
          description: Created analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugAnalysis"

  /analyses/{id}:
    get:
      operationId: getAnalysis
      tags: [analyses]
      summary: Get a bug analysis by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bug analysis with all agent outputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugAnalysisFull"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAnalysis
      tags: [analyses]
      summary: Update an analysis (title, codeContext)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnalysisBody"
      responses:
        "200":
          description: Updated analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugAnalysisFull"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAnalysis
      tags: [analyses]
      summary: Delete a bug analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /analyses/{id}/run:
    post:
      operationId: runAnalysis
      tags: [analyses]
      summary: Run the multi-agent pipeline (SSE stream)
      description: |
        Starts the multi-agent pipeline for the given bug analysis.
        Returns an SSE stream of agent events showing real-time progress.
        Events: { type: "agent_start" | "agent_output" | "agent_done" | "pipeline_done" | "error", agentName: string, content: string }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SSE stream of agent events
          content:
            text/event-stream: {}
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /analyses/{id}/export:
    get:
      operationId: exportAnalysis
      tags: [analyses]
      summary: Export analysis as markdown report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Markdown report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportAnalysisResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /analyses/stats/summary:
    get:
      operationId: getAnalysisStats
      tags: [analyses]
      summary: Get summary stats across all analyses
      responses:
        "200":
          description: Analysis statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStats"

  /github/fetch-issue:
    post:
      operationId: fetchGithubIssue
      tags: [github]
      summary: Fetch a GitHub issue and return its content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchGithubIssueBody"
      responses:
        "200":
          description: GitHub issue content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubIssueContent"
        "400":
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Issue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BugAnalysis:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        inputType:
          type: string
          enum: [raw_text, github_url, stack_trace, jira_ticket, sentry_event, log_file, curl_request, video_description]
        rawInput:
          type: string
        githubUrl:
          type: ["string", "null"]
        codeContext:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, running, completed, failed]
        confidenceScore:
          type: ["number", "null"]
        tags:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - inputType
        - rawInput
        - status
        - createdAt
        - updatedAt

    BugAnalysisFull:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        inputType:
          type: string
          enum: [raw_text, github_url, stack_trace, jira_ticket, sentry_event, log_file, curl_request, video_description]
        rawInput:
          type: string
        githubUrl:
          type: ["string", "null"]
        codeContext:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, running, completed, failed]
        confidenceScore:
          type: ["number", "null"]
        tags:
          type: ["string", "null"]
        extractedEntities:
          type: ["string", "null"]
        hypotheses:
          type: ["string", "null"]
        reproductionSteps:
          type: ["string", "null"]
        testCode:
          type: ["string", "null"]
        flowDiagram:
          type: ["string", "null"]
        clarifyingQuestions:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - inputType
        - rawInput
        - status
        - createdAt
        - updatedAt

    CreateAnalysisBody:
      type: object
      properties:
        title:
          type: string
        inputType:
          type: string
          enum: [raw_text, github_url, stack_trace, jira_ticket, sentry_event, log_file, curl_request, video_description]
        rawInput:
          type: string
        githubUrl:
          type: string
        codeContext:
          type: string
        tags:
          type: string
      required:
        - title
        - inputType
        - rawInput

    UpdateAnalysisBody:
      type: object
      properties:
        title:
          type: string
        codeContext:
          type: string
        tags:
          type: string

    AnalysisStats:
      type: object
      properties:
        total:
          type: integer
        completed:
          type: integer
        running:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
        avgConfidence:
          type: ["number", "null"]
        byInputType:
          type: array
          items:
            $ref: "#/components/schemas/InputTypeCount"
      required:
        - total
        - completed
        - running
        - failed
        - pending
        - avgConfidence
        - byInputType

    InputTypeCount:
      type: object
      properties:
        inputType:
          type: string
        count:
          type: integer
      required:
        - inputType
        - count

    ExportAnalysisResponse:
      type: object
      properties:
        markdown:
          type: string
        title:
          type: string
      required:
        - markdown
        - title

    FetchGithubIssueBody:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    GithubIssueContent:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        state:
          type: string
        labels:
          type: array
          items:
            type: string
        comments:
          type: array
          items:
            type: string
        url:
          type: string
        number:
          type: integer
        author:
          type: string
      required:
        - title
        - body
        - state
        - labels
        - comments
        - url
        - number
        - author

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
